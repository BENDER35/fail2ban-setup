stages:
  - mirror

variables:
  GIT_DEPTH: "0"
  GIT_STRATEGY: fetch

mirror_to_github:
  stage: mirror
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"'
  script:
    - apk add --no-cache git
    - |
      set -eu

      : "${GH_TOKEN:?GH_TOKEN CI variable is missing. Add a GitHub PAT with repo scope.}"

      git config --global --add safe.directory "$CI_PROJECT_DIR"
      git config user.name "GitLab Mirror Bot"
      git config user.email "mirror@users.noreply.gitlab.com"

      REMOTE="https://x-access-token:${GH_TOKEN}@github.com/BENDER35/fail2ban-setup.git"

      # Make every branch and tag available locally.
      git fetch --prune origin '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*' || true
      # Fetch GitHub branches for fast-forward checks.
      git fetch --prune --no-tags "$REMOTE" '+refs/heads/*:refs/remotes/mirror/*' || true

      status=0

      for branch in $(git for-each-ref --format='%(refname:short)' refs/heads); do
        [ -n "$branch" ] || continue
        local_ref="refs/heads/$branch"
        remote_ref="refs/remotes/mirror/$branch"

        if git show-ref --verify --quiet "$remote_ref"; then
          local_sha="$(git rev-parse "$local_ref")"
          remote_sha="$(git rev-parse "$remote_ref")"
          if [ "$local_sha" = "$remote_sha" ]; then
            echo "skip: $branch is already in sync ($local_sha)"
            continue
          fi
          if ! git merge-base --is-ancestor "$remote_sha" "$local_sha"; then
            echo "ERROR: branch $branch diverged. Refusing to force-push. Resolve it manually."
            status=1
            continue
          fi
        fi

        echo "push: $branch -> GitHub"
        git push "$REMOTE" "$local_ref:refs/heads/$branch"
      done

      for tag in $(git for-each-ref --format='%(refname:short)' refs/tags); do
        [ -n "$tag" ] || continue
        local_sha="$(git rev-parse "refs/tags/$tag")"
        remote_sha="$(git ls-remote --tags "$REMOTE" "refs/tags/$tag" | awk '{print $1}' | head -n1 || true)"
        if [ "$local_sha" = "$remote_sha" ]; then
          echo "skip: tag $tag is already in sync"
          continue
        fi
        if [ -n "$remote_sha" ]; then
          echo "ERROR: tag $tag already exists on GitHub with a different commit. Refusing to overwrite it."
          status=1
          continue
        fi
        echo "push: tag $tag -> GitHub"
        git push "$REMOTE" "refs/tags/$tag:refs/tags/$tag"
      done

      exit "$status"
